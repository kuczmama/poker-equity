<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTO Charts - Poker Odds Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'media',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#10b981',
                        dark: '#1f2937',
                        darker: '#111827',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #111827; /* Tailwind gray-900 */
            color: #e5e7eb; /* Tailwind gray-200 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* Grid Styles */
        .gto-grid {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 1;
            margin: 0 auto;
            border: 1px solid #374151;
        }

        .gto-row {
            display: flex;
            flex: 1;
        }

        .gto-cell {
            flex: 1;
            border: 1px solid #1f2937; /* Very subtle border */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            cursor: pointer;
            transition: transform 0.1s;
            user-select: none;
        }

        .gto-cell:hover {
            transform: scale(1.1);
            z-index: 10;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
            border: 1px solid white;
        }

        .hand-label {
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1f2937; 
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280; 
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="w-full py-4 px-4 sm:px-6 lg:px-8 border-b border-gray-200 dark:border-gray-700">
        <div class="max-w-md mx-auto flex justify-center space-x-4">
            <a href="index.html" class="text-sm text-gray-600 dark:text-gray-400 hover:text-primary">Single Hand Calculator</a>
            <span class="text-gray-400">|</span>
            <a href="range-equity.html" class="text-sm text-gray-600 dark:text-gray-400 hover:text-primary">Range Calculator</a>
            <span class="text-gray-400">|</span>
            <a href="range-visual.html" class="text-sm text-gray-600 dark:text-gray-400 hover:text-primary">Visual Range</a>
            <span class="text-gray-400">|</span>
            <a href="bet-sizing.html" class="text-sm text-gray-600 dark:text-gray-400 hover:text-primary">Bet Sizing</a>
            <span class="text-gray-400">|</span>
            <a href="gto-charts.html" class="text-sm font-bold text-primary">GTO Charts</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto p-4 flex flex-col lg:flex-row gap-6">
        
        <!-- Left: Controls & Grid -->
        <div class="flex-1 flex flex-col gap-4">
            
            <!-- Controls -->
            <div class="bg-gray-800 p-4 rounded-lg shadow-lg border border-gray-700">
                <div class="flex justify-between items-center mb-4">
                     <h2 id="current-scenario-title" class="text-lg font-bold text-white">Select Scenario</h2>
                     <div class="flex gap-2">
                        <button id="edit-mode-btn" class="text-gray-400 hover:text-yellow-400" title="Toggle Edit Mode">✏️</button>
                        <button id="save-db-btn" class="text-gray-400 hover:text-green-400" title="Save Database">💾</button>
                        <button id="settings-btn" class="text-gray-400 hover:text-white" title="API Settings">⚙️</button>
                     </div>
                </div>

                <!-- Paint Palette (Edit Mode Only) -->
                <div id="paint-palette" class="hidden mb-3 p-2 bg-gray-900 rounded border border-gray-600 flex gap-2 overflow-x-auto">
                    <button class="palette-tool px-3 py-1 rounded text-xs font-bold bg-red-600 text-white ring-2 ring-white" data-tool="raise">Raise</button>
                    <button class="palette-tool px-3 py-1 rounded text-xs font-bold bg-green-500 text-white opacity-50 hover:opacity-100" data-tool="call">Call</button>
                    <button class="palette-tool px-3 py-1 rounded text-xs font-bold bg-gray-600 text-white opacity-50 hover:opacity-100" data-tool="fold">Fold</button>
                    <button class="palette-tool px-3 py-1 rounded text-xs font-bold bg-gradient-to-r from-red-600 to-green-500 text-white opacity-50 hover:opacity-100" data-tool="mix_raise_call">Mix R/C</button>
                    <button class="palette-tool px-3 py-1 rounded text-xs font-bold bg-gradient-to-r from-gray-600 to-red-600 text-white opacity-50 hover:opacity-100" data-tool="mix_fold_raise">Mix F/R</button>
                    <button class="palette-tool px-3 py-1 rounded text-xs font-bold bg-gradient-to-r from-gray-600 to-green-500 text-white opacity-50 hover:opacity-100" data-tool="mix_fold_call">Mix F/C</button>
                    <button class="palette-tool px-3 py-1 rounded text-xs font-bold bg-red-900 text-white opacity-50 hover:opacity-100" data-tool="allin">All-In</button>
                </div>
                
                <!-- Tree Steps (Flex Container) -->
                <div id="tree-controls" class="flex gap-2 overflow-x-auto pb-2">
                    <!-- Populated by JS -->
                </div>
            </div>

            <!-- Grid Container -->
            <div class="bg-gray-800 p-2 rounded-lg shadow-lg border border-gray-700 relative">
                <div id="gto-grid-container"></div>
            </div>
        </div>

        <!-- Right: Info & AI -->
        <div class="w-full lg:w-96 flex flex-col gap-4">
            
            <!-- Hand Detail -->
            <div class="bg-gray-800 p-4 rounded-lg shadow-lg border border-gray-700 h-1/3">
                <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wide border-b border-gray-700 pb-2 mb-3">Strategy Details</h2>
                <div id="hand-info-content" class="text-gray-300">
                    <p class="italic text-gray-500">Select a hand in the grid to see strategy.</p>
                </div>
            </div>

            <!-- AI Coach -->
            <div class="bg-gray-800 p-4 rounded-lg shadow-lg border border-gray-700 flex-grow flex flex-col">
                <div class="flex justify-between items-center border-b border-gray-700 pb-2 mb-3">
                    <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wide">AI Coach Analysis</h2>
                    <label class="flex items-center text-xs gap-2 cursor-pointer">
                        <input type="checkbox" id="auto-analyze" class="form-checkbox bg-gray-900 border-gray-600 rounded text-primary focus:ring-0">
                        <span>Auto-Ask</span>
                    </label>
                </div>
                
                <div id="coach-response" class="flex-grow overflow-y-auto text-sm text-gray-300 leading-relaxed bg-gray-900/50 p-3 rounded">
                    <p class="italic text-gray-500">Click a hand to ask the coach for advice.</p>
                </div>
            </div>
        </div>

    </main>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center z-50">
        <div class="bg-gray-800 p-6 rounded-lg shadow-xl border border-gray-700 w-96">
            <h3 class="text-xl font-bold mb-4">Settings</h3>
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">OpenRouter API Key</label>
                <input type="password" id="api-key-input" class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 text-white focus:border-primary focus:outline-none" placeholder="sk-or-...">
                <p class="text-xs text-gray-500 mt-1">Key is stored locally in your browser.</p>
            </div>
            <div class="flex justify-end gap-2">
                <button id="close-settings" class="px-4 py-2 text-gray-300 hover:text-white">Cancel</button>
                <button id="save-settings" class="px-4 py-2 bg-primary hover:bg-blue-600 text-white rounded">Save</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="lib/sql-wasm.js"></script>
    <script src="llm-service.js"></script>
    <script src="gto-renderer.js"></script>
    <script src="gto-tree-manager.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
             // Main logic moved to gto-tree-manager.js
             
             // Settings Modal Logic
             const modal = document.getElementById('settings-modal');
             const btn = document.getElementById('settings-btn');
             const closeBtn = document.getElementById('close-settings');
             const saveBtn = document.getElementById('save-settings');
             const input = document.getElementById('api-key-input');
             
             // We need access to the llm instance from treeManager
             // treeManager is global in gto-tree-manager.js
             
             btn.addEventListener('click', () => {
                 if (window.treeManager && window.treeManager.llm) {
                    input.value = window.treeManager.llm.apiKey;
                 }
                 modal.classList.remove('hidden');
             });
 
             closeBtn.addEventListener('click', () => modal.classList.add('hidden'));
 
             saveBtn.addEventListener('click', () => {
                 if (window.treeManager && window.treeManager.llm) {
                    window.treeManager.llm.setApiKey(input.value);
                 }
                 modal.classList.add('hidden');
             });
        });
    </script>
</body>
</html>
